name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install meson ninja pkg-config openjdk@17 fmt googletest

          # The old iOS build scripts are not compatible with CMake 4.x.
          # Use the latest 3.31 maintenance release instead.
          CMAKE_VERSION=3.31.12
          CMAKE_ROOT="$RUNNER_TEMP/cmake-${CMAKE_VERSION}-macos-universal"
          curl -fL \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-macos-universal.tar.gz" \
            -o "$RUNNER_TEMP/cmake.tar.gz"
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP"
          CMAKE_BIN="$CMAKE_ROOT/CMake.app/Contents/bin"

          # gas-preprocessor is no longer available as a Homebrew formula.
          TOOL_BIN="$RUNNER_TEMP/scrcpy-tools/bin"
          mkdir -p "$TOOL_BIN"
          curl -fL \
            https://raw.githubusercontent.com/libav/gas-preprocessor/master/gas-preprocessor.pl \
            -o "$TOOL_BIN/gas-preprocessor.pl"
          chmod +x "$TOOL_BIN/gas-preprocessor.pl"

          # adb-mobile requires host protoc 28.3.
          case "$(uname -m)" in
            arm64) PROTOC_ARCH="aarch_64" ;;
            x86_64) PROTOC_ARCH="x86_64" ;;
            *) echo "Unsupported macOS arch: $(uname -m)"; exit 1 ;;
          esac
          PROTOC_DIR="$RUNNER_TEMP/protoc-28.3"
          mkdir -p "$PROTOC_DIR"
          curl -fL \
            "https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-osx-${PROTOC_ARCH}.zip" \
            -o "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$PROTOC_DIR"

          echo "$CMAKE_BIN" >> "$GITHUB_PATH"
          echo "$TOOL_BIN" >> "$GITHUB_PATH"
          echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix openjdk@17)/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"

          "$CMAKE_BIN/cmake" --version
          "$PROTOC_DIR/bin/protoc" --version

      - name: Patch CI-only build paths
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('porting/Makefile')
          s = p.read_text()
          s = s.replace('export JAVA_HOME="/opt/homebrew/opt/openjdk@17"', 'export JAVA_HOME="$$(/usr/libexec/java_home -v 17)"')
          p.write_text(s)
          PY

          cmake --version
          protoc --version

      - name: Build ADB library for iPhone arm64
        shell: bash
        run: |
          set -euxo pipefail

          # actions/checkout uses shallow submodules, while adb-mobile's
          # protobuf script checks out this tag by name.
          git -C external/adb-mobile/external/protobuf fetch --depth=1 origin \
            refs/tags/v28.3:refs/tags/v28.3
          git -C external/adb-mobile/external/protobuf/third_party/abseil-cpp fetch --depth=1 origin \
            refs/tags/20240722.0:refs/tags/20240722.0 || true

          # Only device arm64 is needed for the IPA. Avoid simulator builds.
          make -C external/adb-mobile/porting \
            lz4/iphoneos/arm64 \
            zstd/iphoneos/arm64 \
            brotli/iphoneos/arm64 \
            protobuf/iphoneos/arm64 \
            adb/iphoneos/arm64

          ADB_OUT="external/adb-mobile/output/iphoneos/arm64"
          rm -f "$ADB_OUT/libadb-full.a"
          test -n "$(find "$ADB_OUT" -maxdepth 1 -name '*.a' -print -quit)"
          libtool -static -o "$ADB_OUT/libadb-full.a" "$ADB_OUT"/*.a

          mkdir -p external/adb-mobile/output/include
          cp -av external/adb-mobile/porting/adb/include/*.h external/adb-mobile/output/include/

          ls -lh "$ADB_OUT/libadb-full.a"

      - name: Build iOS dependencies and scrcpy 3.3.4 server
        shell: bash
        run: |
          set -euxo pipefail

          # Mirror porting/Makefile's adb-mobile target without rebuilding all
          # adb-mobile simulator architectures.
          mkdir -p porting/libs/iphoneos/arm64 porting/libs/include
          cp -av external/adb-mobile/output/iphoneos/arm64/libadb-full.a \
            porting/libs/iphoneos/arm64/
          cp -av external/adb-mobile/output/include/adb_public.h porting/libs/include/

          make -C porting libsdl
          make -C porting ffmpeg
          make -C porting scrcpy
          make -C porting scrcpy-server

      - name: Prepare Xcode library layout
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output/iphone output/include

          cp -v external/adb-mobile/output/iphoneos/arm64/libadb-full.a output/iphone/libadb.a
          cp -v porting/libs/iphoneos/arm64/*.a output/iphone/
          cp -R porting/libs/include/. output/include/

          echo 'iPhone libraries:'
          ls -lah output/iphone
          echo 'scrcpy server:'
          ls -lah scrcpy-app/ADBClient/scrcpy-server

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build
          mkdir -p build/Release-iphoneos

          xcodebuild \
            -project scrcpy-ios/scrcpy-ios.xcodeproj \
            -target scrcpy-ios \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            build

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP_PATH="$(find build/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"

          rm -rf Payload ScrcpyRemote-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ScrcpyRemote-unsigned.ipa Payload

          unzip -l ScrcpyRemote-unsigned.ipa | head -n 30
          ls -lh ScrcpyRemote-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyRemote-unsigned-ipa
          path: ScrcpyRemote-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
